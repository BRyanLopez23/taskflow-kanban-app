<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro | Agile Kanban & Project Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-dark: #0284c7;
            --high: #f43f5e;
            --medium: #f59e0b;
            --low: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand span {
            font-size: 11.5px;
            color: var(--muted);
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input, .select {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
        }

        .input:focus, .select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent-dark);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            background: var(--accent);
            color: #0f172a;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        /* Analytics Bar */
        .stats-bar {
            max-width: 1340px;
            width: 100%;
            margin: 20px auto 0;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .stat-num {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
        }

        /* New Task Form */
        .new-task-bar {
            max-width: 1340px;
            width: 100%;
            margin: 16px auto 0;
            padding: 0 20px;
        }

        .task-form {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .task-form .input {
            flex: 1;
            min-width: 180px;
        }

        /* Kanban Columns */
        .board {
            max-width: 1340px;
            width: 100%;
            margin: 20px auto 32px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
            flex: 1;
        }

        .column {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .col-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .col-title {
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col-count {
            background: #0f172a;
            color: var(--muted);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11.5px;
            font-weight: 700;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }

        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            transition: transform 0.15s, border-color 0.15s;
        }

        .task-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .priority-badge {
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .prio-HIGH { background: rgba(244, 63, 94, 0.18); color: #fb7185; }
        .prio-MEDIUM { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
        .prio-LOW { background: rgba(16, 185, 129, 0.18); color: #34d399; }

        .task-tag {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
        }

        .task-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .task-desc {
            font-size: 12.2px;
            color: var(--muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .task-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-xs {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-xs:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>

<header>
    <div class="brand">
        <div class="brand-icon">TF</div>
        <div>
            <h1>TaskFlow Pro &bull; Agile Kanban Board</h1>
            <span>JavaScript ES6+ OOP &bull; REST JSON Export &bull; Responsive Web App</span>
        </div>
    </div>
    <div class="controls">
        <input type="text" id="searchInput" class="input" placeholder="🔍 Filtrar tareas por título o tag...">
        <select id="filterPriority" class="select">
            <option value="">Todas las prioridades</option>
            <option value="HIGH">Alta Prioridad</option>
            <option value="MEDIUM">Media Prioridad</option>
            <option value="LOW">Baja Prioridad</option>
        </select>
        <button class="btn btn-outline" id="exportJsonBtn">📥 Exportar JSON</button>
    </div>
</header>

<section class="stats-bar">
    <div class="stat-box">
        <span class="stat-label">Total Tareas</span>
        <span class="stat-num" id="statTotal">0</span>
    </div>
    <div class="stat-box">
        <span class="stat-label">En Progreso (WIP)</span>
        <span class="stat-num" id="statProgress">0</span>
    </div>
    <div class="stat-box">
        <span class="stat-label">Completadas</span>
        <span class="stat-num" id="statDone">0</span>
    </div>
    <div class="stat-box">
        <span class="stat-label">Tasa de Avance</span>
        <span class="stat-num" id="statRate">0%</span>
    </div>
</section>

<section class="new-task-bar">
    <form class="task-form" id="taskForm">
        <input type="text" id="taskTitle" class="input" placeholder="Título de la historia de usuario o tarea técnica..." required>
        <input type="text" id="taskDesc" class="input" placeholder="Descripción técnica / criterio de aceptación..." required>
        <input type="text" id="taskTag" class="input" style="max-width:150px;" placeholder="Tag (ej: Backend, API)" required>
        <select id="taskPriority" class="select">
            <option value="HIGH">Prioridad Alta</option>
            <option value="MEDIUM" selected>Prioridad Media</option>
            <option value="LOW">Prioridad Baja</option>
        </select>
        <button type="submit" class="btn">➕ Agregar Tarea</button>
    </form>
</section>

<main class="board">
    <div class="column">
        <div class="col-header">
            <span class="col-title">📋 Por Hacer (Backlog)</span>
            <span class="col-count" id="count-TODO">0</span>
        </div>
        <div class="task-list" id="list-TODO"></div>
    </div>

    <div class="column">
        <div class="col-header">
            <span class="col-title">⚡ En Progreso (In Progress)</span>
            <span class="col-count" id="count-IN_PROGRESS">0</span>
        </div>
        <div class="task-list" id="list-IN_PROGRESS"></div>
    </div>

    <div class="column">
        <div class="col-header">
            <span class="col-title">✅ Completado (Done)</span>
            <span class="col-count" id="count-DONE">0</span>
        </div>
        <div class="task-list" id="list-DONE"></div>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
